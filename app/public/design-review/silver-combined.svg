<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" fill="none"><title>Nalbace combined silver mark and tile preview</title><defs>
<linearGradient id="flow" x1="23" y1="35" x2="77" y2="35" gradientUnits="userSpaceOnUse"><stop stop-color="#2457A7"/><stop offset="1" stop-color="#66CDAA"/></linearGradient>
<linearGradient id="silver" x1="12" y1="8" x2="85" y2="93" gradientUnits="userSpaceOnUse"><stop stop-color="#8B97A5"/><stop offset=".2" stop-color="#F8FAFC"/><stop offset=".39" stop-color="#A4AFBD"/><stop offset=".53" stop-color="#E8EDF3"/><stop offset=".74" stop-color="#929EAC"/><stop offset="1" stop-color="#EEF2F6"/></linearGradient>
<linearGradient id="tile" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#EAF0F7"/></linearGradient>
<g id="paths"><path d="M23 73V35"/><path d="M77 27V65"/><path d="M23 35C23 19 42 15 51 28L77 65C77 81 58 85 49 72Z"/></g>
<g id="mark" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" stroke="url(#flow)"><use href="#paths"/></g>
<g id="outlined"><use href="#paths" stroke="url(#silver)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/><use href="#mark"/></g>
</defs><rect width="960" height="680" rx="24" fill="#F4F7FA"/><text x="48" y="60" fill="#2457A7" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">NALBACE / DESIGN REVIEW</text><text x="48" y="108" fill="#172C3E" font-family="Arial,sans-serif" font-size="32" font-weight="700">Both silver treatments, together</text><text x="48" y="141" fill="#53677B" font-family="Arial,sans-serif" font-size="17">Silver around the mark and around the app tile.</text><rect x="36" y="178" width="508" height="430" rx="22" fill="#FFF" stroke="#DBE2EA"/><g transform="translate(120 198) scale(3.4)"><rect x="4" y="4" width="92" height="92" rx="23" fill="url(#tile)" stroke="url(#silver)" stroke-width="2"/><use href="#outlined" transform="translate(8 8) scale(.84)"/></g><text x="290" y="574" text-anchor="middle" fill="#172C3E" font-family="Arial,sans-serif" font-size="19" font-weight="700">Combined treatment</text><rect x="568" y="178" width="356" height="430" rx="22" fill="#FFF" stroke="#DBE2EA"/><text x="600" y="222" fill="#172C3E" font-family="Arial,sans-serif" font-size="18" font-weight="700">At smaller sizes</text><g transform="translate(610 251) scale(0.96)"><rect x="4" y="4" width="92" height="92" rx="23" fill="url(#tile)" stroke="url(#silver)" stroke-width="2"/><use href="#outlined" transform="translate(8 8) scale(.84)"/></g><g transform="translate(747 267) scale(0.64)"><rect x="4" y="4" width="92" height="92" rx="23" fill="url(#tile)" stroke="url(#silver)" stroke-width="2"/><use href="#outlined" transform="translate(8 8) scale(.84)"/></g><g transform="translate(837 279) scale(0.4)"><rect x="4" y="4" width="92" height="92" rx="23" fill="url(#tile)" stroke="url(#silver)" stroke-width="2"/><use href="#outlined" transform="translate(8 8) scale(.84)"/></g><g fill="#53677B" font-family="Arial,sans-serif" font-size="14" text-anchor="middle"><text x="658" y="377">96 px</text><text x="779" y="377">64 px</text><text x="857" y="377">40 px</text></g><path d="M600 411H892" stroke="#DBE2EA"/><text x="600" y="453" fill="#172C3E" font-family="Arial,sans-serif" font-size="17">The tile border stays visible.</text><text x="600" y="485" fill="#53677B" font-family="Arial,sans-serif" font-size="15">The mark's silver edge becomes</text><text x="600" y="510" fill="#53677B" font-family="Arial,sans-serif" font-size="15">a subtle highlight at small sizes.</text><text x="48" y="650" fill="#53677B" font-family="Arial,sans-serif" font-size="15">Approved treatment. Silver-edged mark; silver-bordered tile where needed.</text></svg>